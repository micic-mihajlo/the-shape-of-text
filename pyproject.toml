[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-shape-of-text"
version = "0.1.0"
description = "Distribution fine-tuning for general-purpose text style alignment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34",
  "datasets>=2.20",
  "peft>=0.12",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "torch>=2.4",
  "tqdm>=4.66",
  "transformers>=5.10.0",
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
mlx = [
  "mlx-lm>=0.31.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
